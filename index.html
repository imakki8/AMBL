<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMBL — Season 31</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e17;
    --panel:#131a29;
    --panel-2:#1a2233;
    --panel-3:#212a3f;
    --line:#232b3d;
    --line-soft:#1b2334;
    --ink:#f2f4f9;
    --ink-soft:#9aa1b8;
    --ink-faint:#5f6780;
    --accent:#3b6fed;
    --accent-dim:#1d3670;
    --accent-soft:rgba(59,111,237,0.14);
    --accent-2:#e63950;

    --thunder:#b1544a;
    --sonics:#1f8a4d;
    --redliners:#d81f2c;
    --rattlers:#c9bb8a;
    --force:#152a52;
    --hornets:#6b3fa0;
    --blazers:#0e1013;
    --gel:#8bcbe0;
    --warriors:#e6a437;

    /* text-safe variants for team-colored TEXT on dark panels (4.5:1+) */
    --thunder-text:#bf6e65;
    --sonics-text:#229754;
    --redliners-text:#e64f59;
    --rattlers-text:#c9bb8a;
    --force-text:#5983d4;
    --hornets-text:#9973c8;
    --blazers-text:#77859b;
    --gel-text:#8bcbe0;
    --warriors-text:#e6a437;

    --def-color:#4fa3f7;
    --xf-color:#3ecf8e;
    --radar-color:#c084f5;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14.5px;
    line-height:1.5;
    min-height:100vh;
  }
  a{color:var(--accent);}

  .wrap{
    max-width:1240px;
    margin:0 auto;
    padding:28px 32px 72px;
  }

  /* ---------- Hero ---------- */
  .hero{
    display:flex;
    align-items:center;
    gap:28px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:26px 34px;
    margin-bottom:16px;
    background-image:radial-gradient(700px 320px at 92% -20%, rgba(59,111,237,0.10), transparent 60%);
  }
  .hero-logo{
    height:78px;
    width:auto;
    flex:none;
  }
  .hero-info{display:flex; flex-direction:column; gap:9px;}
  .hero-tag{
    display:inline-flex;
    align-items:center;
    align-self:flex-start;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-soft);
    border:1px solid var(--accent-dim);
    padding:4px 11px;
    border-radius:20px;
  }
  .hero-venue{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .hero-venue b{color:var(--ink); font-weight:600;}

  /* ---------- Top nav (was sidebar) ---------- */
  .hero-nav{
    display:flex;
    gap:8px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .hero-nav-item{
    display:flex; align-items:center; gap:9px;
    padding:10px 16px;
    border-radius:10px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .hero-nav-item:hover{background:var(--panel-2); color:var(--ink); border-color:var(--ink-faint);}
  .hero-nav-item.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .nav-icon{width:16px; height:16px; flex:none; opacity:.9;}

  /* ---------- Main content ---------- */
  .content{
    min-width:0;
  }

  /* ---------- Preview banner ---------- */
  .preview-banner{
    margin:18px 0 22px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:15px 20px;
    border-radius:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .preview-banner:hover{background:var(--panel-2);}
  .preview-banner-left{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .preview-banner-eyebrow{
    font-weight:800;
    font-size:13px;
    letter-spacing:.02em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .preview-banner-title{
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .preview-banner-arrow{font-size:18px; flex:none; color:var(--accent);}

  /* ---------- Team filter tabs ---------- */
  .rail{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:22px;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    font-weight:600;
    font-size:12.5px;
    color:var(--ink-soft);
    padding:7px 13px;
    border-radius:20px;
    background:var(--panel);
    border:1px solid var(--line);
    cursor:pointer;
    user-select:none;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip:hover{border-color:var(--ink-faint); color:var(--ink);}
  .chip .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chip.all{font-weight:700;}

  /* ---------- Selected team summary ---------- */
  .summary{
    display:none;
    margin-bottom:18px;
    padding:11px 16px;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:10px;
    font-size:12.5px;
    color:var(--ink-soft);
    gap:22px;
    flex-wrap:wrap;
  }
  .summary.show{display:flex;}
  .summary strong{color:var(--ink); font-weight:700;}
  .summary .num{color:var(--accent); font-weight:700;}

  /* ---------- Section headers ---------- */
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;
    margin:34px 0 14px;
  }
  .section-head .title{
    font-size:19px;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .section-head .sub{
    font-size:12px;
    color:var(--ink-faint);
  }

  /* ---------- Weeks / match cards ---------- */
  .week-block{margin-bottom:6px;}

  .show-more-link{
    text-align:center;
    padding:14px;
    margin-top:8px;
    background:var(--panel);
    border:1px dashed var(--line);
    border-radius:12px;
    color:var(--accent);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .show-more-link:hover{background:var(--panel-2); border-color:var(--accent);}
  .week-head{
    display:flex; align-items:baseline; gap:10px;
    margin:20px 0 10px;
  }
  .week-head .wk-num{
    font-weight:800;
    font-size:15px;
  }
  .week-head .wk-date{
    font-size:12px;
    color:var(--ink-faint);
  }

  .games{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
  }
  @media (max-width:1000px){ .games{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .games{grid-template-columns:1fr;} }

  .game{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
  }
  .game.dim{opacity:0.32;}
  .game.lit{border-color:var(--accent); background:var(--accent-soft);}
  .game[data-wk]{cursor:pointer;}
  .game[data-wk]:hover{border-color:var(--ink-faint); transform:translateY(-1px);}
  .game[data-wk]:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .game-status{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .time{
    font-weight:600;
    font-size:11px;
    color:var(--ink-faint);
  }
  .vs{
    font-weight:700;
    font-size:10.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .vs.has-box{
    color:var(--accent);
    cursor:pointer;
    padding:2px 8px;
    border-radius:20px;
    background:var(--accent-soft);
  }
  .vs.has-box:hover{background:rgba(59,111,237,0.24);}
  .ot-tag{margin-left:4px; font-weight:600;}

  .team-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:5px 0;
    gap:8px;
  }
  .team-pill{
    display:flex; align-items:center; gap:8px;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
    min-width:0;
  }
  .team-pill:hover{color:var(--accent);}
  .team-pill::before{
    content:"";
    width:8px; height:8px; border-radius:50%; flex:none;
    background:var(--swatch, var(--ink-faint));
  }
  .team-pill.has-logo::before{display:none;}
  .team-pill.winner{font-weight:800;}
  .pill-score{
    font-weight:800;
    font-size:16px;
    color:var(--ink-soft);
    flex:none;
  }
  .team-pill.winner ~ .pill-score, .team-row:has(.winner) .pill-score{color:var(--ink);}

  .bye-row{
    margin-top:4px;
    padding:9px 14px;
    background:var(--panel);
    border:1px dashed var(--line);
    border-radius:12px;
    display:flex; align-items:center; gap:8px;
    font-size:12px;
    color:var(--ink-faint);
  }
  .bye-label{font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.05em;}
  .bye-pill{
    display:flex; align-items:center; gap:6px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .bye-pill::before{content:""; width:7px; height:7px; border-radius:50%; flex:none; background:var(--swatch, var(--ink-faint));}
  .bye-pill.has-logo::before{display:none;}
  .bye-pill:hover{color:var(--accent);}
  .bye-row.dim{opacity:0.32;}
  .bye-row.lit{border-color:var(--accent); border-style:solid;}
  .bye-row.lit .bye-pill{color:var(--accent);}

  footer{
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-faint);
    text-align:center;
    line-height:1.7;
  }

  /* ---------- Team crest badges ---------- */
  .crest{
    flex:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    overflow:hidden;
    background:var(--panel-3);
    box-shadow:0 0 0 2px var(--line-soft);
  }
  .crest img{width:100%; height:100%; object-fit:cover; display:block;}
  .crest-sm{width:20px; height:20px;}
  .crest-md{width:30px; height:30px;}
  .crest-lg{width:48px; height:48px; box-shadow:0 0 0 3px var(--line-soft);}
  .crest-xl{width:68px; height:68px; box-shadow:0 0 0 3px var(--line-soft);}

  /* ---------- Back link ---------- */
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-weight:600;
    font-size:13px;
    color:var(--accent);
    cursor:pointer;
    margin-bottom:18px;
  }
  .back-btn:hover{text-decoration:underline;}

  .roster-view{display:none;}
  .roster-view.show{display:block;}
  .schedule-view.hide{display:none;}

  .roster-head{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 26px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  .roster-head .name{
    font-weight:800;
    font-size:clamp(24px,4vw,32px);
    letter-spacing:-.01em;
  }
  .roster-head .meta{
    font-size:12px;
    color:var(--ink-faint);
  }

  .roster-body{
    background:var(--panel);
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 16px 16px;
    overflow:hidden;
  }
  .roster-row{
    display:flex; align-items:center; gap:14px;
    padding:13px 24px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .roster-row:last-child{border-bottom:none;}
  .roster-row .num{
    font-weight:700;
    font-size:12px;
    color:var(--ink-faint);
    width:22px;
    flex:none;
  }
  .roster-row .pname{flex:1; font-weight:500;}
  .roster-row.captain .pname{font-weight:700;}
  .captain-badge{
    font-weight:700;
    font-size:10px;
    letter-spacing:.04em;
    color:#fff;
    background:var(--accent);
    padding:3px 9px;
    border-radius:10px;
    flex:none;
  }

  .roster-nav{
    margin-top:20px;
    display:flex; flex-wrap:wrap; gap:6px;
  }

  /* ---------- Box score page ---------- */
  .box-view{display:none;}
  .box-view.show{display:block;}

  .box-head{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 26px;
  }
  .box-head .matchup{
    font-weight:800;
    font-size:clamp(20px,3.6vw,28px);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    letter-spacing:-.01em;
  }
  .box-head .matchup .score{
    font-weight:900;
    color:var(--ink);
  }
  .box-head .sub{
    margin-top:8px;
    font-size:12.5px;
    color:var(--ink-faint);
  }

  .top-performers{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:14px;
    padding:16px 20px;
    margin:20px 0;
  }
  .tp-label{
    font-weight:800;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
  }
  .tp-row{
    display:flex; align-items:center; gap:10px;
    padding:7px 0;
    cursor:pointer;
  }
  .tp-row + .tp-row{border-top:1px solid var(--line);}
  .tp-row:hover .tp-name{text-decoration:underline;}
  .tp-dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .tp-name{font-weight:700; font-size:13.5px; color:var(--ink);}
  .tp-team{font-size:11px; color:var(--ink-faint); flex:none;}
  .tp-stats{font-weight:600; font-size:12px; color:var(--ink-soft); margin-left:auto; flex:none;}

  .box-table-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    overflow-x:auto;
    margin-bottom:16px;
  }
  .box-table-head{
    display:flex; align-items:center; gap:10px;
    padding:12px 18px;
    font-weight:800;
    font-size:15px;
    letter-spacing:-.005em;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  table.box{
    border-collapse:collapse;
    width:100%;
    min-width:740px;
    font-size:12px;
  }
  table.box th, table.box td{
    padding:8px 9px;
    text-align:center;
    white-space:nowrap;
  }
  table.box th{
    color:var(--ink-faint);
    font-weight:700;
    font-size:10.5px;
    letter-spacing:.02em;
    border-bottom:1px solid var(--line);
    text-transform:uppercase;
  }
  table.box tbody tr{border-bottom:1px solid var(--line-soft);}
  table.box tbody tr:nth-child(even){background:rgba(255,255,255,0.015);}
  table.box td:first-child, table.box th:first-child{
    text-align:left;
    font-weight:600;
    position:sticky; left:0;
    background:inherit;
  }
  table.box tr.dnp td{color:var(--ink-faint); font-style:italic; font-weight:400;}
  table.box tr.captain-row td:first-child::after{content:" (C)"; color:var(--accent); font-weight:700;}
  table.box tr.team-row td{
    border-top:1px solid var(--line-soft);
    font-weight:800;
    color:var(--ink);
    background:var(--panel-2);
  }
  table.box tr.team-row td:first-child{background:var(--panel-2);}

  /* ---------- Leaderboard section ---------- */
  .leaders-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-bottom:22px;
  }
  @media (max-width:1000px){ .leaders-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:620px){ .leaders-grid{grid-template-columns:repeat(2,1fr);} }

  .stat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .stat-card-head{
    padding:10px 13px;
    background:var(--panel-2);
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.01em;
    border-bottom:1px solid var(--line);
  }
  .stat-row{
    display:flex; align-items:flex-start; gap:7px;
    padding:7px 13px;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-row:hover{background:var(--panel-2);}
  .stat-rank{
    font-weight:700;
    font-size:11.5px;
    color:var(--ink-faint);
    width:13px;
    flex:none;
    margin-top:1px;
  }
  .stat-dot{width:7px;height:7px;border-radius:50%;flex:none; margin-top:5px;}
  .stat-name{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    flex:1;
    line-height:1.3;
    min-width:0;
    word-break:break-word;
  }
  .stat-val{
    font-size:12.5px;
    font-weight:800;
    color:var(--ink-soft);
    flex:none;
    margin-top:1px;
  }

  .spotlight-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
  }
  @media (max-width:1000px){ .spotlight-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .spotlight-grid{grid-template-columns:1fr;} }

  .spotlight-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .spotlight-head{
    padding:12px 15px;
    border-bottom:1px solid var(--line);
  }
  .spotlight-head .sp-title{
    font-weight:800;
    font-size:14.5px;
    letter-spacing:-.005em;
  }
  .spotlight-card.mvp .spotlight-head{border-top:3px solid var(--accent);}
  .spotlight-card.mvp .spotlight-head .sp-title{color:var(--accent);}
  .spotlight-card.def .spotlight-head{border-top:3px solid var(--def-color);}
  .spotlight-card.def .spotlight-head .sp-title{color:var(--def-color);}
  .spotlight-card.xf .spotlight-head{border-top:3px solid var(--xf-color);}
  .spotlight-card.xf .spotlight-head .sp-title{color:var(--xf-color);}
  .spotlight-card.radar .spotlight-head{border-top:3px solid var(--radar-color);}
  .spotlight-card.radar .spotlight-head .sp-title{color:var(--radar-color);}

  .sp-row{
    display:flex; align-items:flex-start; gap:10px;
    padding:11px 15px;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;
  }
  .sp-row:last-child{border-bottom:none;}
  .sp-row:hover{background:var(--panel-2);}
  .sp-rank{
    font-weight:800;
    font-size:17px;
    color:var(--ink-faint);
    width:18px;
    flex:none;
  }
  .sp-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;}
  .sp-body{flex:1; min-width:0;}
  .sp-name{font-weight:700; font-size:13.5px; color:var(--ink);}
  .sp-line{font-size:11px; color:var(--ink-faint); margin-top:2px;}

  /* ---------- Preview / Tip-Off feature page ---------- */
  .preview-view{display:none;}
  .preview-view.show{display:block;}

  .preview-hero{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:30px 28px;
    margin-bottom:22px;
  }
  .preview-hero-eyebrow{
    font-weight:700;
    font-size:13px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .preview-hero-title{
    font-weight:800;
    font-size:clamp(26px,4.6vw,38px);
    margin:8px 0 12px;
    line-height:1.08;
    letter-spacing:-.01em;
  }
  .preview-hero-sub{
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink-soft);
    max-width:640px;
    margin:0;
  }

  .matchup-card, .bye-spotlight{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
    margin-bottom:14px;
  }
  .bye-spotlight{border-style:dashed;}
  .matchup-meta{
    font-weight:600;
    font-size:11px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:10px;
  }
  .matchup-teams{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:8px;
  }
  .matchup-team{
    display:inline-flex; align-items:center; gap:8px;
    font-weight:800;
    font-size:19px;
    letter-spacing:-.005em;
    cursor:pointer;
  }
  .matchup-team:hover{text-decoration:underline;}
  .matchup-record{
    font-weight:500;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .matchup-vs{
    font-size:12px;
    color:var(--ink-faint);
  }
  .matchup-tag{
    font-weight:700;
    font-size:13.5px;
    color:var(--accent);
    margin-bottom:10px;
  }
  .matchup-body{
    font-size:14px;
    line-height:1.62;
    color:var(--ink-soft);
    margin:0;
    max-width:640px;
  }

  .watch-block{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
    max-width:640px;
  }
  .watch-label{
    font-weight:700;
    font-size:11px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:8px;
  }
  .watch-row{
    margin-bottom:8px;
    cursor:pointer;
    line-height:1.5;
  }
  .watch-row:last-child{margin-bottom:0;}
  .watch-dot{
    display:inline-block;
    width:7px; height:7px; border-radius:50%;
    margin-right:8px;
    position:relative; top:-1px;
  }
  .watch-name{font-weight:700; font-size:14px; color:var(--ink);}
  .watch-row:hover .watch-name{text-decoration:underline;}
  .watch-note{font-size:14px; color:var(--ink-soft);}

  .preview-signoff{
    text-align:center;
    font-size:13px;
    color:var(--ink-faint);
    margin-top:22px;
  }

  html,body{overflow-x:hidden;}

  @media (max-width:820px){
    .wrap{padding:18px 16px 56px;}
    .hero{flex-direction:column; align-items:flex-start; gap:16px; padding:22px 20px;}
    .hero-logo{height:56px;}
    .hero-nav{gap:6px;}
    .hero-nav-item{padding:8px 12px; font-size:12.5px;}
    .nav-icon{width:15px; height:15px;}
  }
</style>
</head>
